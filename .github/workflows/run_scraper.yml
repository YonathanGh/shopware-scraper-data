name: Daily Web Scraper

on:
  schedule:
    # This configures the script to run every 5 minutes (GitHub's maximum speed)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Keeps the manual "Run workflow" button active for instant testing

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Crucial: Allows GitHub to write data.csv back to your repo

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Changes back to GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add data.csv
        git diff-index --quiet HEAD || (git commit -m "Automated live time update" && git push)
